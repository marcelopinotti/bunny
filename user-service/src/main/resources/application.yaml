spring:
  application:
    name: user-service
  # variáveis no .env da raiz do projeto (bunny/.env)
  config:
    import: optional:file:.env[.properties]

  docker:
    compose:
      file: compose.yaml
      # os dois serviços usam o mesmo compose: não derrubar a infra quando um deles parar
      lifecycle-management: start-only

  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    virtual-host: ${RABBIT_VHOST}
    ssl:
      enabled: ${RABBIT_SSL}

aws:
  region: ${AWS_REGION}
  dynamodb:
    table: ${DYNAMODB_USER_TABLE}
    endpoint: ${DYNAMODB_ENDPOINT:}
  sqs:
    email-queue-url: ${EMAIL_QUEUE_URL}

server:
  port: 8081
