spring:
  application:
    name: email-service

  # variáveis no .env da raiz do projeto (bunny/.env)
  config:
    import: optional:file:.env[.properties]

  docker:
    compose:
      file: compose.yaml
      # os dois serviços usam o mesmo compose: não derrubar a infra quando um deles parar
      lifecycle-management: start-only

email:
  from: ${EMAIL_FROM} # identidade verificada no SES (var.sender_email do Terraform)

aws:
  region: ${AWS_REGION}
  dynamodb:
    table: ${DYNAMODB_EMAIL_TABLE}
    endpoint: ${DYNAMODB_ENDPOINT:} # vazio (ou ausente, como na Lambda) = DynamoDB da AWS

server:
  port: 8080
